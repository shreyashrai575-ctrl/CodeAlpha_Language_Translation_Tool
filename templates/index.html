<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinguaAI - Language Translation Tool</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<main class="container">

    <section class="hero">
        <div class="badge">CodeAlpha AI Internship • Task 1</div>

        <h1>Lingua<span>AI</span></h1>

        <p>
            Translate text quickly between multiple languages using an AI-powered translation service.
        </p>
    </section>


    <section class="translator-card">

        <div class="language-row">

            <div class="field">
                <label for="source">Source language</label>

                <select id="source">
                    {% for name, code in languages.items() %}
                    <option value="{{ code }}"
                        {% if code == "en" %}selected{% endif %}>
                        {{ name }}
                    </option>
                    {% endfor %}
                </select>
            </div>


            <button
                id="swapBtn"
                class="swap"
                title="Swap languages"
                aria-label="Swap languages">
                ⇄
            </button>


            <div class="field">
                <label for="target">Target language</label>

                <select id="target">
                    {% for name, code in languages.items() %}
                    <option value="{{ code }}"
                        {% if code == "hi" %}selected{% endif %}>
                        {{ name }}
                    </option>
                    {% endfor %}
                </select>
            </div>

        </div>


        <div class="panels">

            <div class="panel">

                <div class="panel-heading">
                    <span>Your text</span>
                    <span id="charCount">0 characters</span>
                </div>

                <textarea
                    id="inputText"
                    maxlength="5000"
                    placeholder="Type or paste text here..."></textarea>

            </div>


            <div class="panel output-panel">

                <div class="panel-heading">
                    <span>Translation</span>

                    <button
                        id="copyBtn"
                        class="copy"
                        disabled>
                        Copy
                    </button>
                </div>

                <div id="outputText" class="output">
                    Your translation will appear here.
                </div>

            </div>

        </div>


        <button
            id="translateBtn"
            class="translate-btn">
            Translate
        </button>

        <p id="status" class="status"></p>

    </section>


    <footer>
        Built for CodeAlpha Artificial Intelligence Internship — Task 1
    </footer>

</main>


<script>

const input = document.getElementById("inputText");
const output = document.getElementById("outputText");

const source = document.getElementById("source");
const target = document.getElementById("target");

const translateBtn = document.getElementById("translateBtn");
const copyBtn = document.getElementById("copyBtn");
const swapBtn = document.getElementById("swapBtn");

const status = document.getElementById("status");
const charCount = document.getElementById("charCount");


/* Character counter */

input.addEventListener("input", () => {

    charCount.textContent =
        `${input.value.length} characters`;

});


/* Translation */

translateBtn.addEventListener("click", async () => {

    const text = input.value.trim();

    if (!text) {

        status.textContent =
            "Please enter text first.";

        return;
    }


    translateBtn.disabled = true;
    translateBtn.textContent = "Translating...";

    status.textContent = "";

    output.classList.add("loading");

    output.textContent =
        "Working on your translation...";

    copyBtn.disabled = true;


    try {

        const response = await fetch("/translate", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                text: text,
                source: source.value,
                target: target.value
            })

        });


        /*
         * Read the response safely.
         * This prevents:
         * "Unexpected end of JSON input"
         */

        const responseText = await response.text();

        let data = {};

        try {

            data = responseText
                ? JSON.parse(responseText)
                : {};

        } catch (jsonError) {

            throw new Error(
                `Server returned an invalid response (${response.status}).`
            );

        }


        if (!response.ok) {

            throw new Error(
                data.error ||
                `Translation failed (${response.status}).`
            );

        }


        if (!data.translation) {

            throw new Error(
                "No translation was returned by the server."
            );

        }


        output.textContent =
            data.translation;

        copyBtn.disabled = false;

    }


    catch (error) {

        output.textContent =
            "Translation unavailable.";

        status.textContent =
            error.message;

        console.error(
            "Translation error:",
            error
        );

    }


    finally {

        output.classList.remove("loading");

        translateBtn.disabled = false;

        translateBtn.textContent = "Translate";

    }

});


/* Copy */

copyBtn.addEventListener("click", async () => {

    try {

        await navigator.clipboard.writeText(
            output.textContent
        );

        status.textContent =
            "Translation copied!";

        setTimeout(() => {

            status.textContent = "";

        }, 1500);

    } catch (error) {

        status.textContent =
            "Could not copy translation.";

    }

});


/* Swap languages */

swapBtn.addEventListener("click", () => {

    const oldSource = source.value;

    source.value = target.value;

    target.value = oldSource;


    if (
        output.textContent !==
            "Your translation will appear here." &&
        output.textContent !==
            "Translation unavailable."
    ) {

        input.value =
            output.textContent;

        charCount.textContent =
            `${input.value.length} characters`;

        output.textContent =
            "Your translation will appear here.";

        copyBtn.disabled = true;

    }

});

</script>

</body>
</html>
